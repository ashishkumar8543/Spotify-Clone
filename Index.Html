<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Clone</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-brands fa-spotify"></i>
        <span>Spotify</span>
      </div>
      <nav class="nav-links">
        <a href="#" class="active"><i class="fa-solid fa-house"></i> Home</a>
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Search</a>
        <a href="#"><i class="fa-solid fa-book"></i> Your Library</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header>
        <h1>Popular Songs</h1>
      </header>
      <div class="song-list" id="songList">
        <!-- Songs will be injected by JavaScript -->
      </div>
    </main>
  </div>

  <!-- Player Bar -->
  <footer class="player">
    <div class="track-info">
      <img id="currentCover" src="https://via.placeholder.com/50" alt="Cover" />
      <div>
        <div id="currentTitle" class="track-title">Select a Song</div>
        <div id="currentArtist" class="track-artist">-</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="buttons">
        <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
        <button id="playBtn"><i class="fa-solid fa-circle-play"></i></button>
        <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
      </div>
      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" value="0" min="0" max="100" />
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="volume-control">
      <i class="fa-solid fa-volume-high"></i>
      <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.8" />
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
